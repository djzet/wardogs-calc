name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "sea"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            node -e "
              const fs = require('fs');
              const f = 'js/features/lobby.js';
              let c = fs.readFileSync(f, 'utf8');
              c = c.split('__SUPABASE_URL__').join(process.env.SUPABASE_URL);
              c = c.split('__SUPABASE_KEY__').join(process.env.SUPABASE_KEY);
              fs.writeFileSync(f, c);
              console.log('Supabase credentials injected');
            "
          else
            echo "Secrets not found — placeholders remain (OK for forks)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
